<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="토마토 셀프키오스크 휴대폰 회원 결제 흐름 시연" />
    <title>토마토 셀프키오스크 UI 시연</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viewport" aria-label="셀프키오스크 시연 화면">
      <section id="kiosk" class="kiosk" aria-live="polite">
        <header class="header">
          <div class="brand"><strong>Tomato</strong><span>셀프 계산대</span></div>
          <div class="store"><small>현재 이용 매장</small><strong>토마토마트 본점</strong></div>
          <button class="reset-button" id="resetDemo" type="button">처음부터</button>
        </header>

        <div class="quick-guide"><span class="status-dot"></span><strong>상품 바코드를 스캔하거나 오른쪽에서 직접 선택하세요</strong></div>

        <section class="body-grid">
          <section class="cart-panel">
            <h1>상품 담기</h1>
            <div class="cart-columns"><span>상품명</span><span>단가</span><span>수량</span><span>금액</span><span></span></div>
            <div id="cartRows" class="cart-rows"></div>
            <div id="emptyCart" class="empty-cart" hidden>
              <strong>아직 담긴 상품이 없습니다</strong>
              <span>오른쪽 상품을 눌러 장바구니에 담아보세요</span>
            </div>
            <div class="cart-summary">
              <div class="summary-title"><strong>결제 요약</strong><span>할인 적용 완료</span></div>
              <div class="summary-cards">
                <div><small>총 수량</small><strong id="totalQty">0개</strong></div>
                <div class="discount"><small>상품 할인</small><strong id="totalDiscount">0원</strong></div>
                <div class="total"><small>예상 결제금액</small><strong id="cartTotal">0원</strong></div>
              </div>
            </div>
          </section>

          <aside class="catalog-panel">
            <h2>상품 직접 선택</h2>
            <nav class="categories" aria-label="상품 분류">
              <button class="arrow" type="button" aria-label="이전 분류">‹</button>
              <button class="active" type="button">라면</button><button type="button">음료</button><button type="button">냉장</button>
              <button class="arrow" type="button" aria-label="다음 분류">›</button>
            </nav>
            <div id="productGrid" class="product-grid"></div>
          </aside>
        </section>

        <section class="payment-panel">
          <div class="payment-heading">
            <strong>결제수단을 선택한 뒤 결제하기를 눌러주세요</strong>
            <div class="payment-actions">
              <button id="addBag" class="button secondary" type="button">봉투 100원 추가</button>
              <button id="clearCart" class="button muted" type="button">전체 취소</button>
              <button id="startPayment" class="button primary" type="button">결제하기</button>
            </div>
          </div>
          <div class="payment-options">
            <div class="amount-card"><small>지금 결제할 금액</small><strong id="paymentTotal">0원</strong><span>결제하기를 누르면 포인트 확인 단계로 이동합니다</span></div>
            <button class="method selected" data-method="card" type="button"><span class="method-icon blue">▰</span><strong>신용카드</strong><small>IC·MS·NFC 카드</small><em>✓ 선택됨</em></button>
            <button class="method" data-method="easy" type="button"><span class="method-icon red">▦</span><strong>간편결제</strong><small>휴대폰 QR·바코드</small><span class="brands">Kakao Pay · N pay</span></button>
            <button class="method" data-method="cash" type="button"><span class="method-icon green">▣</span><strong>현금결제</strong><small>지폐·동전 사용</small><em class="available">● 현재 사용 가능</em></button>
          </div>
        </section>

        <div id="overlay" class="overlay" hidden>
          <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
        </div>
        <div id="toast" class="toast" role="status" hidden></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
