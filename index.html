<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e83e35" />
    <title>토마토 키오스크 시연</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage-shell" id="stageShell">
      <main class="kiosk" id="kiosk" aria-label="토마토 키오스크 1080×1920 데모">
        <header class="topbar">
          <div class="brand" aria-label="토마토">
            <span class="brand-mark">T</span>
            <span>토마토</span>
          </div>
          <div class="header-actions">
            <span class="demo-chip">DEMO · 1080×1920</span>
            <button class="ghost-button" id="resetButton" type="button">시연 초기화</button>
          </div>
        </header>

        <section class="guide-bar" aria-label="이용 안내">
          <span class="guide-number">1</span>
          <strong>상품을 직접 선택한 뒤 결제를 진행해 주세요.</strong>
          <span class="guide-hint">테스트 회원 010-1234-1234 · 2,000P</span>
        </section>

        <section class="workspace">
          <section class="cart-panel" aria-labelledby="cartTitle">
            <div class="section-heading">
              <div>
                <p class="eyebrow">CART</p>
                <h1 id="cartTitle">상품 담기</h1>
              </div>
              <button class="bag-button" id="addBagButton" type="button">봉투 구매</button>
            </div>
            <div class="cart-table-head" aria-hidden="true">
              <span>상품</span>
              <span>수량</span>
              <span>금액</span>
            </div>
            <div class="cart-list" id="cartList" aria-live="polite"></div>
            <div class="cart-footer">
              <p><span id="cartCount">0</span>개 상품</p>
              <button class="text-button" id="clearCartButton" type="button">전체 취소</button>
            </div>
          </section>

          <section class="catalog-panel" aria-labelledby="catalogTitle">
            <div class="section-heading catalog-heading">
              <div>
                <p class="eyebrow">CATALOG</p>
                <h2 id="catalogTitle">상품 직접 선택</h2>
              </div>
              <div class="catalog-arrows" aria-label="카테고리 이동">
                <button id="previousCategory" type="button" aria-label="이전 카테고리">‹</button>
                <button id="nextCategory" type="button" aria-label="다음 카테고리">›</button>
              </div>
            </div>
            <div class="category-tabs" id="categoryTabs" role="tablist"></div>
            <div class="category-status" aria-live="polite">
              <strong id="activeCategoryName">라면</strong>
              <span id="categoryPosition">1 / 8</span>
            </div>
            <div class="product-grid" id="productGrid"></div>
            <p class="swipe-hint">← 버튼·드래그·스와이프로 카테고리를 이동하세요 →</p>
          </section>
        </section>

        <section class="payment-dock" aria-label="결제 영역">
          <div class="summary-card">
            <div class="metric-row">
              <span>상품 금액</span>
              <strong id="subtotalText">0원</strong>
            </div>
            <div class="metric-row discount-row">
              <span>포인트 사용</span>
              <strong id="discountText">0P</strong>
            </div>
            <div class="metric-row final-row">
              <span>최종 결제금액</span>
              <strong id="totalText">0원</strong>
            </div>
            <p class="member-summary" id="memberSummary">회원 확인 전 · 포인트 사용 전</p>
          </div>

          <div class="payment-options">
            <div class="payment-option-heading">
              <div>
                <p class="eyebrow">PAYMENT</p>
                <h2>결제수단</h2>
              </div>
              <span>먼저 선택해 주세요</span>
            </div>
            <div class="payment-methods" id="paymentMethods">
              <button class="payment-method is-selected" data-method="card" type="button">
                <span class="method-icon">▰</span>
                <strong>신용카드</strong>
              </button>
              <button class="payment-method" data-method="easy" type="button">
                <span class="method-icon">▦</span>
                <strong>간편결제</strong>
              </button>
              <button class="payment-method" data-method="cash" type="button">
                <span class="method-icon">₩</span>
                <strong>현금결제</strong>
              </button>
            </div>
            <button class="primary-button checkout-button" id="checkoutButton" type="button">
              <span id="checkoutLabel">0원 결제하기</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </section>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="modal-layer" id="modalLayer" hidden>
          <div class="modal-backdrop"></div>
          <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div id="modalContent"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
