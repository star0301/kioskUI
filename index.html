<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>토마토 셀프 계산대 · 프로토타입</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css?v=4.3.3" />
  </head>

  <body>
    <!--
      물리 바코드 스캐너는 키보드처럼 동작한다.
      숫자를 빠르게 연타하고 Enter 로 끝내므로, 화면에 보이지 않는 이 입력창에
      포커스를 유지시켜 두고 Enter 시점에 값을 처리한다.
    -->
    <input
      id="scanner-input"
      class="scanner-input"
      type="text"
      autocomplete="off"
      aria-hidden="true"
      tabindex="-1"
    />

    <main class="kiosk" id="kiosk">
      <!-- ─────────────────────────────  헤더  ───────────────────────────── -->
      <header class="header">
        <button class="header__brand" id="btn-reset" type="button">
          <span class="header__brand-name">Tomato</span>
          <span class="header__brand-sub">셀프 계산대</span>
        </button>

        <button class="header__store" id="btn-options" type="button">
          <span class="header__store-label">현재 이용 매장</span>
          <span class="header__store-name">토마토마트 본점</span>
        </button>

        <div class="header__member" id="header-member">
          <div class="header__member-info" id="member-info" hidden>
            <span class="header__member-name" id="member-name"></span>
            <span class="header__member-point" id="member-point"></span>
          </div>
          <button
            class="btn btn--primary btn--sm"
            id="btn-point-lookup"
            type="button"
          >
            포인트 조회
          </button>
        </div>
      </header>

      <!-- ─────────────────────────────  안내 바  ───────────────────────────── -->
      <div class="notice" id="notice">
        <span class="notice__dot" aria-hidden="true"></span>
        <span class="notice__text" id="notice-text">
          상품 바코드를 스캔하거나 오른쪽에서 직접 선택하세요
        </span>
      </div>

      <!-- ─────────────────────────────  본문  ───────────────────────────── -->
      <div class="workspace">
        <!-- 좌측 : 장바구니 -->
        <section class="panel panel--cart">
          <h2 class="panel__title">상품 담기</h2>

          <div class="cart">
            <div class="cart__head">
              <span class="cart__col cart__col--name">상품명</span>
              <span class="cart__col cart__col--price">단가</span>
              <span class="cart__col cart__col--qty">수량</span>
              <span class="cart__col cart__col--amount">금액</span>
              <span
                class="cart__col cart__col--remove"
                aria-hidden="true"
              ></span>
            </div>

            <ul class="cart__list" id="cart-list"></ul>

            <div class="cart__empty" id="cart-empty">
              <div class="cart__empty-icon" aria-hidden="true">
                <svg viewBox="0 0 96 96" width="96" height="96">
                  <circle cx="48" cy="48" r="48" fill="var(--c-bg-subtle)" />
                  <path
                    d="M32 38h32l-3 30a6 6 0 0 1-6 5H41a6 6 0 0 1-6-5z"
                    fill="none"
                    stroke="var(--c-border-strong)"
                    stroke-width="4"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M40 38v-6a8 8 0 0 1 16 0v6"
                    fill="none"
                    stroke="var(--c-border-strong)"
                    stroke-width="4"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <p class="cart__empty-text">담긴 상품이 없습니다</p>
              <p class="cart__empty-sub">
                바코드를 스캔하거나 오른쪽에서 선택해 주세요
              </p>
            </div>
          </div>

          <div class="summary">
            <h3 class="summary__title">결제 요약</h3>
            <div class="summary__metrics">
              <div class="metric">
                <span class="metric__label">총 수량</span>
                <strong class="metric__value" id="sum-qty">0개</strong>
              </div>
              <div class="metric metric--discount">
                <span class="metric__label">상품 할인</span>
                <strong class="metric__value" id="sum-discount">0원</strong>
              </div>
              <div class="metric metric--final">
                <span class="metric__label">예상 결제금액</span>
                <strong class="metric__value" id="sum-total">0원</strong>
              </div>
              <button
                class="metric metric--cancel"
                id="btn-clear-cart"
                type="button"
              >
                <span>전체</span>
                <span>취소</span>
              </button>
            </div>
          </div>
        </section>

        <!-- 우측 : 상품 직접 선택 -->
        <section class="panel panel--catalog">
          <h2 class="panel__title">상품 직접 선택</h2>

          <div class="catalog">
            <div class="catalog__tabs">
              <button
                class="catalog__arrow"
                id="btn-cat-prev"
                type="button"
                aria-label="이전 카테고리"
              >
                <span>‹</span>
              </button>
              <div class="catalog__tab-track" id="category-tabs"></div>
              <button
                class="catalog__arrow"
                id="btn-cat-next"
                type="button"
                aria-label="다음 카테고리"
              >
                <span>›</span>
              </button>
            </div>

            <!--
              프리셋 격자는 항상 2열 × 5행(최대 25개 중 페이지당 10개) 규격을 유지한다.
              grid-auto-flow: column 이므로 상품이 5개뿐인 마지막 페이지는
              1열만 채워지고 오른쪽 열은 의도적으로 비워 둔다.
            -->
            <div class="catalog__grid" id="product-grid"></div>

            <div class="catalog__pager">
              <button
                class="pager__arrow"
                id="btn-page-prev"
                type="button"
                aria-label="이전 페이지"
              >
                <span>‹</span>
              </button>
              <div class="pager__dots" id="page-dots"></div>
              <button
                class="pager__arrow"
                id="btn-page-next"
                type="button"
                aria-label="다음 페이지"
              >
                <span>›</span>
              </button>
            </div>
          </div>

          <button
            class="btn btn--outline btn--block"
            id="btn-bag"
            type="button"
          >
            봉투 구매
          </button>
        </section>
      </div>

      <!-- ─────────────────────────────  하단 결제 바  ───────────────────────────── -->
      <footer class="checkout">
        <div class="methods" id="methods">
          <button class="method" data-method="card" type="button">
            <span class="method__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="48" height="48">
                <rect
                  x="4"
                  y="11"
                  width="40"
                  height="26"
                  rx="5"
                  fill="var(--c-info)"
                />
                <rect
                  x="4"
                  y="17"
                  width="40"
                  height="6"
                  fill="var(--c-info-dark)"
                />
                <rect
                  x="10"
                  y="28"
                  width="12"
                  height="4"
                  rx="2"
                  fill="#ffffff"
                />
              </svg>
            </span>
            <span class="method__name">신용카드</span>
            <span class="method__desc">IC · MS · NFC 카드</span>
            <span class="method__state" data-state="card">현재 사용 가능</span>
          </button>

          <button class="method" data-method="easy" type="button">
            <span class="method__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="48" height="48">
                <rect
                  x="6"
                  y="6"
                  width="36"
                  height="36"
                  rx="8"
                  fill="var(--c-brand)"
                />
                <rect
                  x="13"
                  y="13"
                  width="9"
                  height="9"
                  rx="2"
                  fill="#ffffff"
                />
                <rect
                  x="26"
                  y="13"
                  width="9"
                  height="9"
                  rx="2"
                  fill="#ffffff"
                />
                <rect
                  x="13"
                  y="26"
                  width="9"
                  height="9"
                  rx="2"
                  fill="#ffffff"
                />
                <rect
                  x="28"
                  y="28"
                  width="7"
                  height="7"
                  rx="1.5"
                  fill="#ffffff"
                />
              </svg>
            </span>
            <span class="method__name">간편결제</span>
            <span class="method__desc">QR · 바코드 인식</span>
            <span class="method__pays" aria-hidden="true">
              <span class="pay-chip pay-chip--kakao">Kakao</span>
              <span class="pay-chip pay-chip--naver">N Pay</span>
              <span class="pay-chip pay-chip--payco">PAYCO</span>
              <span class="pay-chip pay-chip--zero">ZERO</span>
            </span>
            <span class="method__state" data-state="easy">현재 사용 가능</span>
          </button>

          <button class="method" data-method="cash" type="button">
            <span class="method__icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" width="48" height="48">
                <rect
                  x="4"
                  y="13"
                  width="40"
                  height="22"
                  rx="4"
                  fill="var(--c-success)"
                />
                <circle cx="24" cy="24" r="7" fill="#ffffff" />
                <circle cx="24" cy="24" r="4" fill="var(--c-success)" />
              </svg>
            </span>
            <span class="method__name">현금결제</span>
            <span class="method__desc">지폐 · 동전 사용</span>
            <span class="method__state" data-state="cash">현재 사용 가능</span>
          </button>
        </div>
      </footer>
    </main>

    <!-- ─────────────────────────────  모달 루트  ───────────────────────────── -->
    <div class="overlay" id="overlay" hidden>
      <div
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      ></div>
    </div>

    <!-- 토스트 : 스캔 결과처럼 짧게 알리는 메시지 -->
    <div class="toast" id="toast" hidden></div>

    <script src="app.js?v=4.3.3"></script>
    <script src="modals.js?v=4.3.3"></script>
  </body>
</html>
