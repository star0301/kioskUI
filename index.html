<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e83e35" />
    <title>토마토 키오스크 시연</title>
    <link rel="stylesheet" href="styles.css?v=20260903-3" />
  </head>
  <body>
    <div class="stage-shell" id="stageShell">
      <main class="kiosk" id="kiosk" aria-label="토마토 키오스크 1080×1920 데모">
        <header class="topbar">
          <div class="brand" aria-label="토마토 셀프 계산대">
            <strong>Tomato</strong>
            <span>셀프 계산대</span>
          </div>
          <div class="store-context">
            <span>현재 이용 매장</span>
            <strong>토마토마트 본점</strong>
          </div>
          <div class="header-actions">
            <div class="guide-hint" id="memberHeader" hidden>
              <strong id="memberPhoneText"></strong>
              <span id="memberPointText"></span>
            </div>
            <button class="header-reset" id="resetButton" type="button">시연 초기화</button>
          </div>
        </header>

        <section class="guide-bar" aria-label="이용 안내">
          <span class="guide-dot" aria-hidden="true"></span>
          <strong>상품 바코드를 스캔하거나 오른쪽에서 직접 선택하세요</strong>
        </section>

        <section class="workspace">
          <section class="cart-panel" aria-labelledby="cartTitle">
            <div class="section-heading cart-heading">
              <h1 id="cartTitle">상품 담기</h1>
            </div>
            <div class="cart-table-head" aria-hidden="true">
              <span>상품명</span>
              <span>단가</span>
              <span>수량</span>
              <span>금액</span>
            </div>
            <div class="cart-list" id="cartList" aria-live="polite"></div>
          </section>

          <section class="catalog-panel" aria-labelledby="catalogTitle">
            <div class="section-heading catalog-heading">
              <h2 id="catalogTitle">상품 직접 선택</h2>
            </div>
            <div class="category-navigation">
              <button class="category-arrow" id="previousCategory" type="button" aria-label="이전 카테고리">
                <img src="assets/chevron-left.png" alt="" />
              </button>
              <div class="category-tabs" id="categoryTabs" role="tablist"></div>
              <button class="category-arrow next" id="nextCategory" type="button" aria-label="다음 카테고리">
                <img src="assets/chevron-right.png" alt="" />
              </button>
            </div>
            <div class="category-status" aria-live="polite" hidden>
              <strong id="activeCategoryName">라면</strong>
              <span id="categoryPosition">1 / 8</span>
            </div>
            <div class="product-grid" id="productGrid"></div>
          </section>
        </section>

        <section class="payment-dock is-disabled" id="paymentDock" aria-label="결제 영역">
          <div class="payment-heading">
            <strong id="paymentGuideText">상품을 담으면 결제할 수 있습니다</strong>
            <div class="payment-actions">
              <button class="bag-button" id="addBagButton" type="button">봉투 구매</button>
              <button class="cancel-button" id="clearCartButton" type="button">전체 취소</button>
              <button class="pay-button" id="checkoutButton" type="button" disabled>
                <span id="checkoutLabel">결제하기</span>
              </button>
            </div>
          </div>
          <div class="payment-options">
            <div class="total-amount-card">
              <div>
                <span>지금 결제할 금액</span>
                <strong id="totalText">0원</strong>
              </div>
              <p id="amountHint">상품을 먼저 담아주세요</p>
            </div>
            <div class="payment-methods" id="paymentMethods">
              <button class="payment-method is-selected" data-method="card" type="button">
                <span class="method-icon card"><img src="assets/payment-card.png" alt="" /></span>
                <strong>신용카드</strong>
                <small>IC·MS·NFC 카드</small>
              </button>
              <button class="payment-method" data-method="easy" type="button">
                <span class="method-icon easy"><img src="assets/payment-easy.png" alt="" /></span>
                <strong>간편결제</strong>
                <small>휴대폰 QR·바코드</small>
                <span class="easy-pay-brands"><i>Kakao Pay</i><i>N pay</i><i>Alipay</i><i>WeChat</i><i>zero</i></span>
              </button>
              <button class="payment-method" data-method="cash" type="button">
                <span class="method-icon cash"><img src="assets/payment-cash.png" alt="" /></span>
                <strong>현금결제</strong>
                <small>지폐·동전 사용</small>
                <span class="cash-available">● 현재 사용 가능</span>
              </button>
            </div>
          </div>
          <span id="subtotalText" hidden>0원</span>
          <span id="discountText" hidden>0P</span>
          <span id="memberSummary" hidden>회원 확인 전</span>
          <span id="cartCount" hidden>0</span>
        </section>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="modal-layer" id="modalLayer" hidden>
          <div class="modal-backdrop"></div>
          <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div id="modalContent"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="app.js?v=20260903-3"></script>
  </body>
</html>
